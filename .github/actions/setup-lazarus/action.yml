name: Setup Lazarus/FPC
description: Install Lazarus, FPC, and Qt6Pas (from the distro repos) on an Ubuntu runner.

# This action owns the pinned Lazarus/FPC toolchain for linux amd64 (see the
# default URLs below). Every workflow that needs the toolchain calls it
# without URLs and inherits that pin — there is deliberately no second copy to
# keep in sync. Only a caller building for a *different* architecture (the
# linux arm64 leg of build.yml) passes its own URLs.

inputs:
  fpc_laz_url:
    description: Download URL for the fpc-laz .deb package. Empty = the pinned amd64 default.
    required: false
    default: ''
  fpc_src_url:
    description: Download URL for the fpc-src .deb package. Empty = the pinned amd64 default.
    required: false
    default: ''
  laz_url:
    description: Download URL for the lazarus-project .deb package. Empty = the pinned amd64 default.
    required: false
    default: ''
  extra_packages:
    description: Additional apt packages to install alongside the base set (space-separated)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install system packages
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        # Qt6Pas comes from the distro repos (libqt6pas6 runtime + libqt6pas-dev
        # headers) rather than pinned upstream .deb downloads.
        sudo apt-get install -y \
          p7zip-full curl pkg-config \
          qt6-base-dev qt6-tools-dev qt6-base-dev-tools \
          libqt6pas6 libqt6pas-dev \
          libcurl4-openssl-dev \
          ${{ inputs.extra_packages }}

    # ---- Pinned toolchain (linux amd64) -----------------------------------
    # The URLs after || are the defaults. Bump these three together; the
    # weekly drift scan fails if a Lazarus version elsewhere under .github/
    # disagrees with them. An unset matrix key expands to an empty string
    # rather than dropping the input, so empty (not absent) selects the default.
    - name: Download Lazarus/FPC
      id: fetch
      uses: ./.github/actions/fetch-toolchain
      with:
        urls: |
          ${{ inputs.fpc_laz_url || 'https://download.lazarus-ide.org/Lazarus%20Linux%20amd64%20DEB/Lazarus%205.0RC1/fpc-laz_3.2.2-210709_amd64.deb' }}
          ${{ inputs.fpc_src_url || 'https://download.lazarus-ide.org/Lazarus%20Linux%20amd64%20DEB/Lazarus%205.0RC1/fpc-src_3.2.2-210709_amd64.deb' }}
          ${{ inputs.laz_url || 'https://download.lazarus-ide.org/Lazarus%20Linux%20amd64%20DEB/Lazarus%205.0RC1/lazarus-project_5.0.0-0_amd64.deb' }}

    - name: Install Lazarus/FPC
      shell: bash
      env:
        DL: ${{ steps.fetch.outputs.dir }}
      run: |
        set -euo pipefail
        # Only the three .debs fetched above are in the directory.
        sudo dpkg -i "$DL"/*.deb || true
        sudo apt-get -f install -y
