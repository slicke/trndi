name: Nightly FPC Health

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch: {}

concurrency:
  group: trndi-nightly-fpc-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fpc-console-health:
    # Preview image: needed for libqt6pas6/-dev (setup-lazarus), which only
    # entered the Ubuntu archive in 25.10 (not present on 24.04/ubuntu-latest).
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # Toolchain URLs come from the action's own pin — see setup-lazarus.
      - name: Install FPC/Lazarus and test prerequisites
        uses: ./.github/actions/setup-lazarus

      - name: Show tool versions
        run: |
          set -euo pipefail
          lazbuild --version
          fpc -iV

      - name: Verify Pascal module naming consistency
        run: |
          set -euo pipefail
          make check-module-names

      - name: Build and run console tests (no extensions, headless)
        run: |
          set -euo pipefail
          make noext-test WIDGETSET=qt6
