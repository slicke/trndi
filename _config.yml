# GitHub Pages configuration for Trndi
title: "Trndi - CGM Data on Desktop & Raspberry Pi"
description: "Desktop app for blood sugar monitoring. Works with Nightscout, Dexcom Share, Tandem Source, Medtronic CareLink, FreeStyle Libre (LibreLinkUp), and xDrip. Supports Windows, macOS, Linux, and Raspberry Pi."
url: "https://trndi.app"
baseurl: ""

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Exclude files from processing
exclude:
  - README.md
  - LICENSE.md
  - CONTRIBUTING.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - _sass
  - _posts
  - _drafts
  - backup/
  - tests/
  - lib/
  - mORMot/
  - mORMot2/
  - libdextro/
  - units/
  - inc/
  - unists/
  - lx/
  - "*.lpi"
  - "*.lpr"
  - "*.lps"
  - "*.exe"
  - "*.o"
  - "*.ppu"
  - "*.rsj"
  - "*.res"
  - "*.trc"
  - "*.log"

# Include files that would normally be excluded.
# Guides, docs and translation catalogs are NOT copied here — they live in the
# main repo, every link on the page points at GitHub, and the copies only ever
# drifted out of date. doc/ stays for the images alone: index.html uses them,
# and Trndi's About dialog hotlinks https://trndi.app/doc/img/trndi-logo.png.
include:
  - doc/

plugins:
  - jekyll-sitemap
  - jekyll-feed

# SEO settings
twitter:
  username: 
github:
  repository_url: https://github.com/slicke/trndi